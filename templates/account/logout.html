{% extends "social_auth_app/_base.html" %} {% load i18n %} 
{% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card mt-5 shadow-sm">
        <div class="card-body text-center">
          <h3 class="card-title mb-4">{% trans "Signed Out" %}</h3>
          <p>{% trans "You have been successfully logged out." %}</p>
          <a href="{% url 'account_login' %}" class="btn btn-primary"
            >{% trans "Sign In" %}</a
          >
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
