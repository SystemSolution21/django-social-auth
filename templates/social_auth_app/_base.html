<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Django Social Login</title>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-primary">
      <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'home' %}">MySite</a>

        <div class="collapse navbar-collapse justify-content-end">
          <ul class="navbar-nav">
            {% if user.is_authenticated %}
              <li class="nav-item">
                <span class="nav-link"> {{ user.username }}</span>
              </li>
              <li class="nav-item">
                <a class="btn btn-danger" href="{% url 'account_logout' %}">Logout</a>
              </li>
            {% else %}
              <li class="nav-item">
                <a class="btn btn-primary" href="{% url 'account_login' %}">Sign In</a>
              </li>
            {% endif %}
          </ul>
        </div>
      </div>
    </nav>

    <!-- Messages -->
    {% if messages %}
    <div class="container mt-3">
      {% for message in messages %}
      <div
        class="alert alert-{{ message.tags }} fade show" role="alert">
        {{ message }}
      </div>
      {% endfor %}
    </div>
    {% endif %}

    {% block content %} {% endblock content %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Auto-close alerts script -->
    <script>
      // Wait for the DOM to be fully loaded
      document.addEventListener("DOMContentLoaded", function () {
        // Select all alert elements
        const alerts = document.querySelectorAll(".alert");
        alerts.forEach(function (alert) {
          // Set a timeout to close the alert after 3000ms (3 seconds)
          setTimeout(() => new bootstrap.Alert(alert).close(), 3000);
        });
      });
    </script>
  </body>
</html>
